<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schwarm – Details Tracker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#ffffff;--fg:#0a0a0a;--muted:#f5f5f5;--mfg:#737373;--border:#e5e5e5;--input:#e5e5e5;--inbg:transparent;--primary:#171717;--pfg:#fafafa;--destr:#dc2626;--ok:#16a34a;--shadow:0 1px 2px rgba(0,0,0,.05)}
.t.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#262626;--mfg:#a1a1a1;--border:rgba(255,255,255,.1);--input:rgba(255,255,255,.15);--inbg:rgba(255,255,255,.045);--primary:#e5e5e5;--pfg:#171717;--destr:#ff6467;--ok:#4ade80;--shadow:none}
.t{font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.43;color:var(--fg)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.m{color:var(--mfg)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid transparent;font:500 14px 'Geist',sans-serif;white-space:nowrap;color:var(--fg);background:none}
.out{background:var(--inbg);border-color:var(--input);box-shadow:var(--shadow)}
.icb{width:32px;padding:0}
.tl{display:flex;padding:3px;border-radius:10px;background:var(--muted);height:36px;box-sizing:border-box}
.tt{flex:1;border:1px solid transparent;border-radius:7px;background:none;color:var(--mfg);font:500 14px 'Geist',sans-serif}
.tt.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .tt.on{background:var(--inbg);border-color:var(--input)}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.h{font-weight:500}
</style>
</helmet>
<div class="t {{theme}}" style="width: 480px; height: 900px; box-sizing: border-box; background: var(--bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; position: relative; overflow: hidden">
  <button class="btn icb" aria-label="Schließen" style="position: absolute; top: 12px; right: 12px; opacity: .7"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  <div style="padding: 16px 48px 0 16px; display: flex; flex-direction: column; gap: 6px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 600">Sintel (2010) 4K Open Movie</h2>
    <p class="m" style="margin: 0">Filme · lädt · 41 %</p>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div class="tl" role="tablist">
      <button class="tt" role="tab">Übersicht</button>
      <button class="tt" role="tab">Dateien</button>
      <button class="tt" role="tab">Peers</button>
      <button class="tt on" role="tab" aria-selected="true">Tracker</button>
    </div>

    <div style="display: flex; gap: 8px">
      <button class="btn out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Tracker hinzufügen</button>
      <button class="btn out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>Alle neu ankündigen</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{trackers}}" as="t" hint-placeholder-count="3">
        <div class="card">
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="mono" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.url}}</span>
            <button class="btn icb" aria-label="Aktionen" style="height: 28px; width: 28px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
          </div>
          <div class="num" style="display: flex; gap: 12px; font-size: 13px; flex-wrap: wrap; align-items: center">
            <span style="display: inline-flex; align-items: center; gap: 6px; color: {{t.color}}"><span style="width: 6px; height: 6px; border-radius: 99px; background: {{t.color}}"></span>{{t.status}}</span>
            <span class="m">Stufe {{t.tier}}</span>
            <span class="m">{{t.counts}}</span>
            <span class="m">{{t.next}}</span>
          </div>
          <sc-if value="{{t.hasMsg}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: var(--destr)">{{t.msg}}</span></sc-if>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="h">Weitere Quellen</span>
      <div class="num" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div class="card" style="gap: 2px"><span class="m" style="font-size: 13px">DHT</span><span style="font-weight: 600">38 Peers</span></div>
        <div class="card" style="gap: 2px"><span class="m" style="font-size: 13px">PeX</span><span style="font-weight: 600">12 Peers</span></div>
        <div class="card" style="gap: 2px"><span class="m" style="font-size: 13px">LSD</span><span style="font-weight: 600">0 Peers</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between"><span class="h">HTTP-Quellen</span><button class="btn" style="height: 28px; padding: 0 8px">Hinzufügen</button></div>
      <div class="card" style="flex-direction: row; align-items: center; gap: 8px">
        <span class="mono" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">https://download.blender.org/durian/movies/</span>
        <button class="btn icb" aria-label="Aktionen" style="height: 28px; width: 28px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":480,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    return {
      theme: dark ? 'dark' : '',
      trackers: [
        { url: 'udp://tracker.opentrackr.org:1337/announce', tier: 0, color: 'var(--ok)', status: 'Funktioniert', counts: '87 Seeds · 21 Peers', next: 'nächste Meldung in 24 Min', hasMsg: false },
        { url: 'https://tracker.example.org/announce', tier: 1, color: 'var(--ok)', status: 'Funktioniert', counts: '52 Seeds · 9 Peers', next: 'in 18 Min', hasMsg: false },
        { url: 'udp://tracker.dead.example:6969/announce', tier: 2, color: 'var(--destr)', status: 'Fehler', counts: '– Seeds · – Peers', next: 'neuer Versuch in 3 Min', hasMsg: true, msg: 'Zeitüberschreitung: Tracker antwortet nicht.' }
      ]
    };
  }
}
</script>
</body>
</html>
