<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schwarm – Torrent hinzufügen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#ffffff;--fg:#0a0a0a;--muted:#f5f5f5;--mfg:#737373;--border:#e5e5e5;--input:#e5e5e5;--inbg:transparent;--primary:#171717;--pfg:#fafafa;--ring:#a1a1a1;--overlay:#a3a3a3;--shadow:0 1px 2px rgba(0,0,0,.05)}
.t.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#262626;--mfg:#a1a1a1;--border:rgba(255,255,255,.1);--input:rgba(255,255,255,.15);--inbg:rgba(255,255,255,.045);--primary:#e5e5e5;--pfg:#171717;--ring:#737373;--overlay:#000000;--shadow:none}
.t{font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.43;color:var(--fg)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.m{color:var(--mfg)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;font:500 14px 'Geist',sans-serif;white-space:nowrap;cursor:pointer;color:var(--fg);background:none;text-decoration:none}
.pri{background:var(--primary);color:var(--pfg)}
.out{background:var(--inbg);border-color:var(--input);box-shadow:var(--shadow)}
.lbl{font-size:14px;font-weight:500;line-height:1}
.inp{display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--inbg);box-shadow:var(--shadow);color:var(--fg)}
.tl{display:flex;padding:3px;border-radius:10px;background:var(--muted);height:36px;box-sizing:border-box}
.tt{flex:1;border:1px solid transparent;border-radius:7px;background:none;color:var(--mfg);font:500 14px 'Geist',sans-serif}
.tt.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .tt.on{background:var(--inbg);border-color:var(--input)}
.cb{width:16px;height:16px;box-sizing:border-box;border-radius:4px;border:1px solid var(--input);display:inline-grid;place-items:center;background:var(--inbg);flex:none}
.cb.on{background:var(--primary);border-color:var(--primary);color:var(--pfg)}
</style>
</helmet>
<div class="t {{theme}}" style="width: 600px; height: 680px; box-sizing: border-box; padding: 40px 32px; background: color-mix(in srgb, var(--overlay) 55%, var(--bg)); display: flex; align-items: flex-start">
  <div role="dialog" aria-labelledby="dt" aria-describedby="dd" style="flex: 1; position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <a href="Main.dc.html" aria-label="Schließen" style="position: absolute; top: 16px; right: 16px; opacity: .7; color: var(--fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="dt" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1">Torrent hinzufügen</h2>
      <p id="dd" class="m" style="margin: 0">Magnet-Link einfügen oder eine .torrent-Datei wählen.</p>
    </div>

    <div class="tl" role="tablist">
      <button class="tt on" role="tab" aria-selected="true">Link</button>
      <button class="tt" role="tab">Datei</button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl">Magnet-Link oder URL</span>
      <span class="mono" style="display: block; min-height: 64px; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--ring); border-radius: 8px; background: var(--inbg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent); word-break: break-all; line-height: 1.5">magnet:?xt=urn:btih:3b245504cf5f11bbdbe1201cea6a6bf45aee1bc0&amp;dn=ubuntu-26.04-desktop-amd64.iso</span>
      <span class="m" style="font-size: 13px">Mehrere Links: einer pro Zeile.</span>
    </label>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px">
      <svg class="ic" viewBox="0 0 24 24" style="margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-weight: 500">ubuntu-26.04-desktop-amd64.iso</span>
        <span class="m" style="font-size: 13px">6,1 GB · 1 Datei · 1.204 Seeds</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span class="lbl">Kategorie</span>
        <span class="inp" style="justify-content: space-between">Linux<svg class="ic m" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span class="lbl">Speichern in</span>
        <span class="inp mono">/downloads/linux</span>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; align-items: center; gap: 8px"><span class="cb on" role="checkbox" aria-checked="true"><svg class="ic" viewBox="0 0 24 24" style="width: 12px; height: 12px; stroke-width: 3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="lbl">Sofort starten</span></label>
      <label style="display: flex; align-items: center; gap: 8px"><span class="cb" role="checkbox" aria-checked="false"></span><span class="lbl">Der Reihe nach laden</span><span class="m" style="font-size: 13px">zum Streamen</span></label>
    </div>

    <button class="btn" style="align-self: flex-start; padding: 0; height: auto; color: var(--mfg)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>Weitere Optionen
    </button>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px">
      <a class="btn out" href="Main.dc.html">Abbrechen</a>
      <a class="btn pri" href="Main.dc.html">Hinzufügen</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":600,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    return { theme: dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
