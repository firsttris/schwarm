<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schwarm – Handy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
.t{--bg:#ffffff;--fg:#0a0a0a;--muted:#f5f5f5;--mfg:#737373;--border:#e5e5e5;--input:#e5e5e5;--inbg:transparent;--primary:#171717;--pfg:#fafafa;--destr:#dc2626;--ok:#16a34a;--shadow:0 1px 2px rgba(0,0,0,.05)}
.t.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#262626;--mfg:#a1a1a1;--border:rgba(255,255,255,.1);--input:rgba(255,255,255,.15);--inbg:rgba(255,255,255,.045);--primary:#e5e5e5;--pfg:#171717;--destr:#ff6467;--ok:#4ade80;--shadow:none}
.t{font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.43;color:var(--fg)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.m{color:var(--mfg)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font:500 14px 'Geist',sans-serif;color:var(--fg);background:none;text-decoration:none}
.pri{background:var(--primary);color:var(--pfg)}
.out{background:var(--inbg);border-color:var(--input);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font:500 12px 'Geist',sans-serif}
.tl{display:flex;padding:3px;border-radius:10px;background:var(--muted);height:36px;box-sizing:border-box}
.tt{flex:1;border:1px solid transparent;border-radius:7px;background:none;color:var(--mfg);font:500 13px 'Geist',sans-serif}
.tt.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .tt.on{background:var(--inbg);border-color:var(--input)}
.prog{height:6px;border-radius:99px;background:color-mix(in srgb,var(--primary) 20%,transparent);overflow:hidden}
.prog span{display:block;height:100%;background:var(--primary)}
.it{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);text-decoration:none}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;color:var(--mfg);font:500 11px 'Geist',sans-serif;text-decoration:none}
</style>
</helmet>
<div class="t {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Torrents</h1>
        <span class="m num" style="font-size: 13px">↓ 38,4 MB/s · ↑ 4,1 MB/s</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <span class="badge"><span style="width: 6px; height: 6px; border-radius: 99px; background: var(--ok)"></span>VPN</span>
        <a class="btn pri" href="Hinzufuegen.dc.html" aria-label="Torrent hinzufügen" style="width: 36px; padding: 0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></a>
      </div>
    </div>
    <div class="tl" role="tablist">
      <button class="tt on" role="tab" aria-selected="true">Alle</button>
      <button class="tt" role="tab">Lädt 3</button>
      <button class="tt" role="tab">Seedet 4</button>
      <button class="tt" role="tab">Fehler 1</button>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; border-top: 1px solid var(--border)">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <a class="it" href="Details.dc.html">
        <span style="display: flex; align-items: baseline; gap: 12px">
          <span style="flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
          <span class="num" style="font-size: 13px; font-weight: 500">{{r.pct}} %</span>
        </span>
        <span class="prog"><span style="width: {{r.pct}}%"></span></span>
        <span class="num" style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="color: {{r.stColor}}">{{r.status}}</span>
          <span class="m">{{r.right}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Hauptmenü" style="display: flex; border-top: 1px solid var(--border); padding: 0 8px 12px">
    <a class="tb" href="PhoneListe.dc.html" aria-current="page" style="color: var(--fg)"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>Torrents</a>
    <a class="tb" href="#"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Suche</a>
    <a class="tb" href="#"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>RSS</a>
    <a class="tb" href="Einstellungen.dc.html"><svg class="ic" viewBox="0 0 24 24" style="width: 20px; height: 20px" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>Einstellungen</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var raw = [
      ['ubuntu-26.04-desktop-amd64.iso', 73, 'Lädt · 18,4 MB/s', 'noch 1 Min'],
      ['Sintel (2010) 4K Open Movie', 41, 'Lädt · 12,9 MB/s', 'noch 11 Min'],
      ['Fedora-Workstation-Live-x86_64-44', 96, 'Lädt · 7,1 MB/s', 'noch 6 s'],
      ['debian-13.2.0-amd64-DVD-1.iso', 100, 'Seedet · 820 KB/s', 'Ratio 2,41'],
      ['Big Buck Bunny 60fps 4K', 100, 'Seedet · 1,4 MB/s', 'Ratio 1,87'],
      ['linuxmint-22.3-cinnamon-64bit.iso', 58, 'Gestoppt', '2,9 GB'],
      ['0 A.D. Alpha 27 (Linux)', 34, 'Fehler: Tracker antwortet nicht', '', 1]
    ];
    return {
      theme: dark ? 'dark' : '',
      rows: raw.map(function (r) { return { name: r[0], pct: r[1], status: r[2], right: r[3], stColor: r[4] ? 'var(--destr)' : 'var(--mfg)' }; })
    };
  }
}
</script>
</body>
</html>
