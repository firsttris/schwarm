<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schwarm – Kategorien und Tags</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.t{--bg:#ffffff;--fg:#0a0a0a;--muted:#f5f5f5;--mfg:#737373;--border:#e5e5e5;--input:#e5e5e5;--inbg:transparent;--primary:#171717;--pfg:#fafafa;--destr:#dc2626;--ring:#a1a1a1;--overlay:#a3a3a3;--shadow:0 1px 2px rgba(0,0,0,.05)}
.t.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#262626;--mfg:#a1a1a1;--border:rgba(255,255,255,.1);--input:rgba(255,255,255,.15);--inbg:rgba(255,255,255,.045);--primary:#e5e5e5;--pfg:#171717;--destr:#ff6467;--ring:#737373;--overlay:#000000;--shadow:none}
.t{font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.43;color:var(--fg)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.m{color:var(--mfg)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid transparent;font:500 14px 'Geist',sans-serif;white-space:nowrap;color:var(--fg);background:none}
.pri{background:var(--primary);color:var(--pfg)}
.out{background:var(--inbg);border-color:var(--input);box-shadow:var(--shadow)}
.icb{width:32px;padding:0}
.tl{display:flex;padding:3px;border-radius:10px;background:var(--muted);height:36px;box-sizing:border-box}
.tt{flex:1;border:1px solid transparent;border-radius:7px;background:none;color:var(--mfg);font:500 14px 'Geist',sans-serif}
.tt.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .tt.on{background:var(--inbg);border-color:var(--input)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 32px 32px;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.inp{display:flex;align-items:center;height:32px;box-sizing:border-box;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:var(--inbg)}
</style>
</helmet>
<div class="t {{theme}}" style="width: 600px; height: 640px; box-sizing: border-box; padding: 32px; background: color-mix(in srgb, var(--overlay) 55%, var(--bg)); display: flex; align-items: flex-start">
  <div role="dialog" aria-labelledby="kt" style="flex: 1; position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <button class="btn icb" aria-label="Schließen" style="position: absolute; top: 12px; right: 12px; opacity: .7"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="kt" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1">Kategorien und Tags</h2>
      <p class="m" style="margin: 0">Kategorien bestimmen den Speicherort, Tags sind frei.</p>
    </div>
    <div class="tl" role="tablist">
      <button class="tt on" role="tab" aria-selected="true">Kategorien</button>
      <button class="tt" role="tab">Tags</button>
    </div>

    <div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
      <div class="row">
        <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Filme</span><span class="mono m">/downloads/filme</span></span>
        <span class="m" style="font-size: 13px">3 Torrents</span>
        <button class="btn icb" aria-label="Filme bearbeiten"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg></button>
        <button class="btn icb" aria-label="Filme löschen"><svg class="ic m" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path></svg></button>
      </div>
      <div style="padding: 12px; border-bottom: 1px solid var(--border); background: var(--muted); display: flex; flex-direction: column; gap: 10px">
        <div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Name</span><span class="inp" style="border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent); background: var(--bg)">Linux</span></label>
          <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Speichern in</span><span class="inp mono" style="background: var(--bg)">/downloads/linux</span></label>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px">
          <button class="btn out" style="background: var(--bg)">Abbrechen</button>
          <button class="btn pri">Sichern</button>
        </div>
      </div>
      <div class="row" style="padding-left: 28px">
        <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Linux/Server</span><span class="mono m">/downloads/linux/server</span></span>
        <span class="m" style="font-size: 13px">2 Torrents</span>
        <button class="btn icb" aria-label="Bearbeiten"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg></button>
        <button class="btn icb" aria-label="Löschen"><svg class="ic m" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path></svg></button>
      </div>
      <div class="row">
        <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Spiele</span><span class="mono m">/downloads/spiele</span></span>
        <span class="m" style="font-size: 13px">1 Torrent</span>
        <button class="btn icb" aria-label="Bearbeiten"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg></button>
        <button class="btn icb" aria-label="Löschen"><svg class="ic m" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path></svg></button>
      </div>
      <div class="row" style="border-bottom: 0">
        <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Serien</span><span class="mono m">/downloads/serien</span></span>
        <span class="m" style="font-size: 13px">unbenutzt</span>
        <button class="btn icb" aria-label="Bearbeiten"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg></button>
        <button class="btn icb" aria-label="Löschen"><svg class="ic m" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <button class="btn" style="padding: 0 8px; color: var(--mfg)">Unbenutzte entfernen</button>
      <span style="flex: 1"></span>
      <button class="btn out">Unterkategorie</button>
      <button class="btn pri"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Kategorie</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":600,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    return { theme: dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
