# Documentation as a website: https://firsttris.github.io/schwarm/
# Source is docs/, built with Zensical (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && zensical serve
[project]
site_name = "Schwarm"
site_description = "A calm, modern web UI for qBittorrent, for the desktop and the phone. Static files that qBittorrent serves itself as its alternative WebUI."
site_author = "Tristan Teufel"
site_url = "https://firsttris.github.io/schwarm/"
repo_url = "https://github.com/firsttris/schwarm"
repo_name = "firsttris/schwarm"
edit_uri = "edit/main/docs/"
copyright = "License AGPL-3.0 · Schwarm is not affiliated with the qBittorrent project."
docs_dir = "docs"
# Pages as install.html instead of install/: the relative image paths then match,
# which also have to work on GitHub
use_directory_urls = false

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Features" = "guide.md" },
  { "Screenshots" = "screenshots.md" },
  { "FAQ" = "faq.md" },
  { "For developers" = [
    { "Development" = "development.md" },
    { "Specification" = "spec.md" },
    { "Feature map" = "features.md" },
  ] },
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
features = [
  "content.code.copy",
  "content.action.edit",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Follows the system setting, switchable like in the app
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/firsttris/schwarm"
name = "Source code on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/tristanteu/schwarm"
name = "Docker mod on Docker Hub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
